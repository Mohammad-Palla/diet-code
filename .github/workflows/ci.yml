name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p diet-code-cli

      - name: Smoke test the CLI
        run: |
          ./target/release/diet-code --version
          ./target/release/diet-code analyze fixtures/unused-function --json | grep -q '"symbol": "unusedHelper"'

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build binary and smoke test the wrapper offline
        run: |
          cargo build --release -p diet-code-cli
          DIET_CODE_BINARY_PATH="$PWD/target/release/diet-code" node npm/diet-code/smoke-test.cjs
