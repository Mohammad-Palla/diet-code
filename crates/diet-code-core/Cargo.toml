[package]
name = "diet-code-core"
version = "0.2.0"
edition = "2021"
description = "Local-first static repository analyzer core for Diet Code"
license = "MIT"
repository = "https://github.com/Mohammad-Palla/diet-code"
keywords = ["dead-code", "static-analysis", "tree-sitter", "refactoring"]
categories = ["development-tools"]

[dependencies]
tree-sitter = "=0.22.6"
tree-sitter-typescript = "=0.21.2"
tree-sitter-javascript = "=0.21.4"
tree-sitter-python = "=0.21.0"
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2"
ignore = "=0.4.23"
rayon = "1"
regex = "1"
globset = "=0.4.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
